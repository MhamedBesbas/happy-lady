<!DOCTYPE html>
<html lang="fr" dir="ltr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Lady — السيدة السعيدة</title>
<style>
  :root{
    --primary:#b4456f;--primary-h:#953158;--accent:#c9a227;
    --bg:#fdf8f5;--surface:#fff;--text:#2c1e23;--muted:#7a6a6e;
    --border:#eaded9;--danger:#c0392b;
    --radius:12px;--shadow:0 2px 10px rgba(44,30,35,.06);
  }
  [data-theme="dark"]{
    --bg:#161112;--surface:#221a1d;--text:#f2e8e5;--muted:#a89498;
    --border:#3a2c30;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:0.3s}
  header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:1rem}
  .header-inner{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center}
  .logo{font-weight:800;font-size:1.2rem;color:var(--text)}
  .logo span{color:var(--primary)}
  .header-actions button{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:.4rem .6rem;border-radius:8px;margin-left:.5rem;cursor:pointer}
  .hero{padding:3rem 1rem;text-align:center;background:linear-gradient(135deg,#fdf8f5,#fff)}
  [data-theme="dark"] .hero{background:linear-gradient(135deg,#161112,#221a1d)}
  .hero h1{font-size:1.8rem;margin-bottom:1rem}
  .hero p{color:var(--muted);margin-bottom:1.5rem}
  .search-bar{max-width:500px;margin:auto;display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.3rem}
  .search-bar input{flex:1;border:none;background:transparent;color:var(--text);padding:.6rem;outline:none}
  .search-bar button{background:var(--primary);color:#fff;border:none;padding:.6rem 1rem;border-radius:8px;font-weight:bold}
  .container{max-width:1200px;margin:auto;padding:2rem 1rem}
  .section-title{font-size:1.4rem;margin-bottom:1rem}
  .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .card img{width:100%;height:150px;object-fit:cover}
  .card-body{padding:.8rem}
  .card-title{font-size:.9rem;font-weight:bold;margin-bottom:.3rem}
  .card-price{color:var(--primary);font-weight:bold}
  .card-partner{font-size:.75rem;color:var(--muted);text-transform:uppercase}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Happy<span>Lady</span></div>
    <div class="header-actions">
      <button onclick="toggleTheme()" id="theme-btn">🌙</button>
    </div>
  </div>
</header>

<section class="hero">
  <h1>Bienvenue chez Happy Lady</h1>
  <p>Les meilleurs produits pour la femme et la famille algérienne.</p>
  <div class="search-bar">
    <input type="text" id="search" placeholder="Rechercher un produit..." onkeyup="filtrer()">
    <button>🔍</button>
  </div>
</section>

<section class="container">
  <h2 class="section-title">Nos Produits</h2>
  <div class="product-grid" id="grid"></div>
</section>

<script>
  // 1. GESTION DU MODE SOMBRE
  function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.getElementById('theme-btn').textContent = isDark ? '🌙' : '☀️';
  }

  // 2. LES DONNÉES DES PRODUITS (Tu pourras les modifier plus tard)
  const produits = [
    { nom: "Crème hydratante aloe vera", prix: "2 400 DA", partenaire: "Soqfy", img: "https://images.unsplash.com/photo-1556228720-195a672e8a03?w=500" },
    { nom: "Robe d'été fleurie", prix: "4 500 DA", partenaire: "Cosmos", img: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=500" },
    { nom: "Set 5 casseroles", prix: "8 900 DA", partenaire: "TidjaraDZ", img: "https://images.unsplash.com/photo-1584990347449-a8d1d1c8e5e4?w=500" },
    { nom: "Poussette bébé compacte", prix: "18 500 DA", partenaire: "Safir", img: "https://images.unsplash.com/photo-1591291621164-2c6367723315?w=500" }
  ];

  // 3. AFFICHAGE DES PRODUITS
  function afficherProduits(liste) {
    const grid = document.getElementById('grid');
    grid.innerHTML = "";
    liste.forEach(p => {
      grid.innerHTML += `
        <div class="card">
          <img src="${p.img}" alt="${p.nom}">
          <div class="card-body">
            <div class="card-partner">${p.partenaire}</div>
            <div class="card-title">${p.nom}</div>
            <div class="card-price">${p.prix}</div>
          </div>
        </div>
      `;
    });
  }

  // 4. BARRE DE RECHERCHE
  function filtrer() {
    const texte = document.getElementById('search').value.toLowerCase();
    const resultats = produits.filter(p => p.nom.toLowerCase().includes(texte));
    afficherProduits(resultats);
  }

  // Lancer l'affichage au démarrage
  afficherProduits(produits);
</script>

</body>
</html>
